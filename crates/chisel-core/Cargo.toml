[package]
name = "chisel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# The CSS color parser of AnyCanvas (the Rust twin of css_color.h, bit-equal to the runtime's header
# and the SDK's TS twin): what `colorCurve()` literals fold through.
anycanvas-css-color = { git = "https://github.com/letary/AnyCanvas", rev = "f093b71a5dd60cec7fe66d8c8bd4912a63f6b250" }
swc_core = { version = "71.0.4", features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_codegen",
    "ecma_visit",
    "ecma_utils",
    "ecma_transforms",
    "ecma_transforms_typescript",
    "ecma_minifier",
    "common_sourcemap",
] }
