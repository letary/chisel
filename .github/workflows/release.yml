# Build the `chisel` binary for each target and attach it to the GitHub release for the pushed tag.
# Push a tag (or publish a release, which creates the tag) to trigger:
#   git tag v0.1.0 && git push origin v0.1.0
# Produces release assets: chisel-<target>.tar.gz (+ .sha256). The linux build is a fully static
# musl binary (chisel is pure Rust, no C deps) that runs in any linux image — e.g. download it in a
# Dockerfile, untar to /usr/local/bin/chisel, and pin the tag so builds stay reproducible.

name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write # create the release + upload assets

jobs:
  upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest } # production (static)
          - { target: aarch64-apple-darwin,       os: macos-latest }  # local dev (Apple Silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: chisel
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
